<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ali Hafidz Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--blue:#0A64BC;--blue2:#084f96;--navy:#06223F;--mute:#42505f;--mx:0;--my:0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#d5d2cc;color:var(--navy);font:400 16px/1.6 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:300;margin:0}
#gl{position:fixed;inset:0}#gl canvas{display:block}
.scrim{position:fixed;left:0;right:0;bottom:0;height:42vh;background:linear-gradient(transparent,rgba(10,16,24,.42));pointer-events:none;z-index:2}
.ov{position:fixed;inset:0;z-index:4;pointer-events:none}
.ov>*{opacity:0;transform:translate3d(calc(var(--mx)*-8px),calc(var(--my)*-5px + 24px),0);transition:opacity .8s,transform .9s}
.ov.on>*{opacity:1;transform:translate3d(calc(var(--mx)*-8px),calc(var(--my)*-5px),0);transition-delay:.55s}
.ov.on>*:nth-child(2){transition-delay:.7s}.ov.on>*:nth-child(3){transition-delay:.85s}
.ov a,.ov button{pointer-events:auto}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--blue);color:#fff;border:0;border-radius:99px;padding:0 34px;height:54px;font:500 15px/1 Inter,sans-serif;letter-spacing:.14em;text-decoration:none;cursor:pointer;box-shadow:0 12px 28px -10px rgba(10,100,188,.8);transition:background .3s,transform .3s}
.btn:hover{background:var(--blue2);transform:translateY(-2px) scale(1.03)}.btn.o{background:transparent;color:var(--navy);border:1px solid var(--navy);box-shadow:none}
.wk{position:absolute;left:0;right:0;bottom:11vh;text-align:center;color:#fff;padding:0 6vw}
.wk .n{font-size:12px;letter-spacing:.3em;text-transform:uppercase;opacity:.85;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.wk h2{font-weight:400;font-size:clamp(28px,3.6vw,58px);letter-spacing:.04em;line-height:1.15;margin:.5vh 0 .8vh;text-shadow:0 2px 18px rgba(0,0,0,.55)}
.wk p{margin:0 0 2.4vh;font-size:clamp(14px,1.25vw,19px);text-shadow:0 1px 10px rgba(0,0,0,.6)}
.eb{font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:var(--blue);font-weight:500;margin-bottom:1.6vh}
.home{position:absolute;left:8vw;top:14vh}.home h1{font-size:clamp(36px,4.6vw,78px);line-height:1.04;max-width:16ch;text-shadow:0 2px 30px rgba(255,255,255,.7)}.home h1 em{font-style:normal;color:var(--blue)}
.badge{display:inline-flex;align-items:center;gap:9px;padding:7px 15px 7px 12px;border-radius:99px;background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.85);box-shadow:0 10px 24px -14px rgba(6,34,63,.5);font-size:13px;line-height:1.3;color:var(--navy);margin-bottom:2.2vh}
.badge .dot{flex:none;width:8px;height:8px;border-radius:50%;background:#22b35a;animation:ping 2s infinite}@keyframes ping{0%{box-shadow:0 0 0 0 rgba(34,179,90,.55)}70%,100%{box-shadow:0 0 0 9px rgba(34,179,90,0)}}
.home .eb{font-size:clamp(12px,1.05vw,15px);margin-bottom:1.4vh;color:var(--navy)}.home .eb .roll{color:var(--blue);font-weight:500}
.roll{display:inline-block;overflow:hidden;height:1.5em;vertical-align:bottom;transition:width .6s cubic-bezier(.6,0,.2,1)}.ri{display:block;transition:transform .6s cubic-bezier(.6,0,.2,1)}.ri i{display:block;font-style:normal;height:1.5em;line-height:1.5em;white-space:nowrap;width:max-content}
.home .sub{font-weight:500;font-size:clamp(14px,1.15vw,17px);color:var(--navy);margin:2vh 0 1.2vh}.ar{display:inline-block;animation:nx 1.6s ease-in-out infinite}@keyframes nx{50%{transform:translateX(5px)}}
.home p{max-width:46ch;color:var(--mute);margin:0 0 3.2vh}.hint{font-size:12px;letter-spacing:.26em;text-transform:uppercase;animation:p 2s infinite}@keyframes p{50%{opacity:.35}}
.glass{position:absolute;top:21vh;width:min(27vw,420px);padding:0;text-shadow:0 1px 16px rgba(255,255,255,.45)}
.glass.l{left:4vw}.glass.r{right:4vw}
.abw{position:absolute;inset:0}.glass.ab{top:21vh}.glass.l.ab{width:min(33.5vw,520px)}.glass.r.ab{width:min(28vw,430px)}
.glass.ab p{font-size:clamp(13px,min(1.02vw,1.9vh),15px);line-height:1.55;margin:0 0 1.15em}.ab .row{margin-top:1.6vh}.ab .btn{height:48px;padding:0 26px;font-size:13px}.btn svg{width:17px;height:17px;flex:none}
.glass.ab h2.wx{font-size:clamp(22px,2.2vw,34px);margin-bottom:2.6vh}
.xp{position:relative;margin-left:5px;padding:0 0 clamp(14px,2.6vh,26px) 24px;border-left:1px solid rgba(6,34,63,.35)}.xp:last-child{padding-bottom:0;border-color:transparent}
.xp::before{content:"";position:absolute;left:-5px;top:.3em;width:9px;height:9px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px rgba(10,100,188,.16)}
.xp .d{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);font-weight:500}.xp h3{font:500 15px/1.3 Inter,system-ui,sans-serif;margin:.35em 0 .1em}.xp .c{font-size:14px;color:var(--mute)}.xp .a{font-size:13.5px;line-height:1.5;color:var(--mute);margin-top:.5em}.glass h2{font-size:clamp(24px,2.5vw,40px);line-height:1.12;margin-bottom:1.6vh}.glass h3{font-size:22px;margin-bottom:1vh}.glass .xp h3{font-size:15px;margin:.35em 0 .1em}
.glass p{color:var(--mute);margin:0 0 2.6vh;font-size:15px}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.row a.t{color:var(--navy);font-size:14px}
.h{display:grid;grid-template-columns:92px 1fr;padding:1.2vh 0;border-top:1px solid rgba(6,34,63,.16);font-size:14px}.h span{color:var(--mute)}.h b{font-weight:500}
.cw{position:absolute;inset:0}.ct{position:absolute;left:6vw;top:14vh;width:31vw}.ct h2{font-size:clamp(34px,4vw,66px);line-height:1.04;text-shadow:0 2px 30px rgba(255,255,255,.7)}.ct h2 em{font-style:normal;color:var(--blue)}.ct p{max-width:44ch;color:var(--mute);margin:2.2vh 0 0;font-size:clamp(14px,1.1vw,17px)}
.cl{display:flex;flex-direction:column;max-width:380px;margin-top:3.4vh}.cl a{display:flex;align-items:center;justify-content:space-between;padding:clamp(10px,1.6vh,16px) 0;border-bottom:1px solid rgba(6,34,63,.35);color:var(--navy);text-decoration:none;font:300 clamp(20px,min(2.1vw,3.4vh),32px)/1.2 Fraunces,Georgia,serif;transition:color .3s,border-color .3s}.cl a svg,.ln svg{width:.8em;height:.8em;flex:none;transition:transform .3s}.cl a:hover{color:var(--blue);border-color:var(--blue)}.cl a:hover svg{transform:translate(4px,-4px)}
.ov>.cw{transform:translate3d(0,24px,0)}.ov.on>.cw{transform:none}
.pane{background:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.8);border-radius:20px;box-shadow:0 30px 60px -24px rgba(6,34,63,.45)}
.cr,.tcol{display:contents}.uw{display:none}.tv{position:absolute;left:0;top:0;overflow:hidden;pointer-events:auto;will-change:transform}.tv::after{content:"";position:absolute;inset:3.2%;border:1px solid #d4d1ca;pointer-events:none}
.tn{position:absolute;left:0;top:0;display:flex;justify-content:center;will-change:transform}.tb{display:flex;gap:12px}
.tb button{width:44px;height:44px;border-radius:50%;border:1px solid rgba(6,34,63,.3);background:rgba(255,255,255,.78);color:var(--navy);cursor:pointer;display:grid;place-items:center;transition:background .3s,color .3s,border-color .3s}.tb button:hover{background:var(--blue);border-color:var(--blue);color:#fff}.tb svg{width:18px;height:18px}
.ucard{position:absolute;left:0;top:0;min-width:0;box-sizing:border-box;text-shadow:0 1px 16px rgba(255,255,255,.45);will-change:transform}.ucard .btn{flex:none;width:auto;min-width:62%;justify-content:center;height:50px;padding:0 26px;font-size:13px}.ur{display:flex;flex-direction:column;align-items:center;gap:clamp(12px,1.9vh,18px)}.dr{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:4px 12px;text-align:center;font-size:13.5px;line-height:1.4;color:var(--navy)}.dr span{color:var(--mute)}.ln{display:inline-flex;align-items:center;gap:6px;color:var(--navy);font-weight:500;text-decoration:none;border-bottom:1px solid var(--blue);white-space:nowrap}.ln:hover{color:var(--blue)}
/* portrait fallback (3D frames are hidden there): HTML cards */
.tt{display:flex;width:100%;height:100%;transition:transform .8s cubic-bezier(.6,0,.2,1)}.ts{flex:0 0 100%;min-width:0;margin:0;display:flex;flex-direction:column;padding:calc(var(--u,4px)*7.5)}
.qm{font:300 calc(var(--u,4px)*15)/.7 Fraunces,Georgia,serif;color:var(--blue);height:.5em}.ts blockquote{margin:calc(var(--u,4px)*4.5) 0 calc(var(--u,4px)*3);font-family:Fraunces,Georgia,serif;font-weight:300;font-size:max(12.5px,calc(var(--u,4px)*var(--k,4.9)));line-height:1.42;color:var(--navy)}.ts figcaption{margin-top:auto;display:flex;align-items:center;gap:12px;font-size:max(12.5px,calc(var(--u,4px)*3.5));line-height:1.35}.ts figcaption b{font-weight:500}.ts figcaption span span{color:var(--mute)}.av{flex:none;width:max(30px,calc(var(--u,4px)*8.7));height:max(30px,calc(var(--u,4px)*8.7));border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:max(11px,calc(var(--u,4px)*3));letter-spacing:.06em}
.uw{aspect-ratio:888/472;border-radius:14px;overflow:hidden;background:#181818}.uw img{width:100%;height:100%;object-fit:cover;display:block}
header{position:fixed;z-index:6;top:0;left:0;right:0;height:9vh;min-height:56px;padding:env(safe-area-inset-top,0px) 28px 0;display:flex;align-items:center;justify-content:space-between;color:var(--navy)}
header b{font:400 22px Fraunces,Georgia,serif}header nav{display:flex;gap:30px;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase}.logo{display:block;line-height:0;filter:drop-shadow(0 6px 14px rgba(6,34,63,.35))}.logo img{height:38px;width:auto;display:block}
header nav a{color:#fff;opacity:.82;cursor:pointer;padding:8px 0;border-bottom:2px solid transparent;text-shadow:0 1px 10px rgba(0,0,0,.45);transition:opacity .3s,border-color .3s}header nav a:hover{opacity:1}header nav a.on{opacity:1;border-bottom-color:#fff}
.dots{position:fixed;z-index:6;left:0;right:0;bottom:calc(3.4vh + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;align-items:center;gap:16px}
.dots button{width:11px;height:11px;border-radius:50%;border:1.5px solid #fff;background:transparent;padding:0;cursor:pointer;transition:.3s;box-shadow:0 1px 6px rgba(0,0,0,.35)}.dots button.on{background:#fff;width:34px;border-radius:9px}
.arr{position:fixed;z-index:6;top:46vh;width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.25);color:#fff;font-size:20px;cursor:pointer;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.arr.p{left:22px}.arr.n{right:22px}.arr:disabled{opacity:.2;cursor:default}
#intro{position:fixed;inset:0;z-index:9;color:var(--navy);font:300 clamp(30px,4.6vw,68px)/1.1 Fraunces,Georgia,serif;text-align:center}
#intro .ip{position:absolute;left:0;right:0;height:50%;background:#f3f1ec;overflow:hidden;display:flex;justify-content:center;transition:transform 1.15s cubic-bezier(.77,0,.18,1)}#intro .t{top:0;align-items:flex-end}#intro .b{bottom:0;align-items:flex-start}
#intro.go .t{transform:translateY(-101%)}#intro.go .b{transform:translateY(101%)}#intro.go{visibility:hidden;transition:visibility 0s 1.3s}
#intro .lb{position:absolute;left:50%;top:calc(50% + 1.15em + 26px);width:min(220px,52vw);height:3px;transform:translateX(-50%);background:rgba(6,34,63,.14);border-radius:3px;overflow:hidden;z-index:2;transition:opacity .25s}#intro .lb i{display:block;height:100%;background:var(--blue);transform-origin:left;transform:scaleX(0);transition:transform .35s ease-out}#intro.go .lb{opacity:0}
html,body{overscroll-behavior:none}.ov:not(.on) *{pointer-events:none!important}
#bg{display:none;position:fixed;z-index:12;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;width:44px;height:44px;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}#bg span{position:absolute;left:10px;right:10px;top:50%;height:1.5px;background:var(--navy);border-radius:2px;transition:transform .35s cubic-bezier(.6,0,.2,1)}#bg span:first-child{transform:translateY(-4px)}#bg span:last-child{transform:translateY(3px)}#bg.x span:first-child{transform:rotate(45deg)}#bg.x span:last-child{transform:rotate(-45deg)}
#menu{display:none;position:fixed;inset:0;z-index:11;background:#fff;flex-direction:column;align-items:center;justify-content:center;gap:30px;opacity:0;visibility:hidden;transition:opacity .35s,visibility 0s .35s}#menu.on{opacity:1;visibility:visible;transition:opacity .35s}#menu a{font:300 40px/1.1 Fraunces,Georgia,serif;color:var(--navy);text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent}#menu a.on{color:var(--blue)}
.cwm{position:absolute;inset:0}.ov>.cwm,.ov.on>.cwm{transform:none}
.sheet{position:absolute;left:4vw;right:4vw;bottom:calc(var(--vh,1vh)*8.5);max-height:calc(var(--vh,1vh)*34);overflow:hidden;cursor:pointer;box-sizing:border-box;padding:28px 22px 26px;border-radius:22px;background:rgba(255,255,255,.97);box-shadow:0 -10px 40px -18px rgba(6,34,63,.45);text-shadow:none;pointer-events:auto;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;transition:max-height .55s cubic-bezier(.6,0,.2,1)}.sheet.sc{max-height:calc(var(--vh,1vh)*30)}.sheet.open{max-height:calc(var(--vh,1vh)*91.5 - 68px);overflow-y:auto;cursor:auto}
.sheet .grab{position:absolute;top:9px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:4px;background:rgba(6,34,63,.25)}.sheet:not(.open)::after{content:"";position:absolute;left:0;right:0;bottom:0;height:80px;background:linear-gradient(rgba(255,255,255,0),#fff);pointer-events:none}
.sheet p{font-size:13px;line-height:1.55;color:var(--mute);margin:0 0 12px;max-width:none}.sheet .eb{margin-bottom:10px}.sheet h2{font-size:clamp(24px,7.2vw,30px);line-height:1.1;margin:0 0 10px}.sheet h2 em{font-style:normal;color:var(--blue)}.sheet h2.wx{font-size:22px;margin:26px 0 18px}.sheet .row{margin:16px 0 0}.sheet .btn{height:44px;padding:0 22px;font-size:12px}.sheet .cl{max-width:none;margin-top:18px}.sheet .cl a{font-size:20px;padding:12px 0}.sheet .xp:last-child{padding-bottom:12px}
@media (orientation:portrait){header nav{display:none}#bg{display:block}#menu{display:flex}
.home{left:6vw;right:6vw;top:23vh}.home h1{max-width:none;font-size:clamp(22px,6.4vw,27px);line-height:1.1}.badge{font-size:11px;padding:6px 12px 6px 10px;margin-bottom:1.4vh}.home .eb{font-size:10.5px;margin-bottom:.8vh}.home .sub{font-size:11px;line-height:1.45;margin:1.2vh 0 .8vh}.home p{font-size:11.5px;line-height:1.45;margin:0 0 1.8vh;max-width:none}.home .btn{height:40px;padding:0 20px;font-size:11px}
.wk{top:auto;bottom:calc(12vh + env(safe-area-inset-bottom,0px))}.wk .btn{height:36px;padding:0 18px;font-size:10.5px}.arr{display:none}.ucard .btn{height:42px;padding:0 22px;font-size:12px}.ur{gap:10px}.dr{font-size:12.5px}}

/* ===== Case study page (slides up from the bottom) ===== */
#cs{--acc:var(--blue);--accx:var(--acc);--onacc:#fff;position:fixed;inset:0;z-index:13;display:flex;flex-direction:column;background:#f3f1ec;color:var(--navy);transform:translate3d(0,100%,0);visibility:hidden;transition:transform .95s cubic-bezier(.77,0,.18,1),visibility 0s .95s;box-shadow:0 -30px 80px -30px rgba(6,34,63,.55)}
#cs.on{transform:none;visibility:visible;transition:transform .95s cubic-bezier(.77,0,.18,1),visibility 0s}
.cs-top{position:relative;flex:none;height:calc(64px + env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:space-between;padding:env(safe-area-inset-top,0px) 28px 0;border-bottom:1px solid rgba(6,34,63,.1)}
.cs-top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--acc);transform:scaleX(var(--sp,0));transform-origin:left}
.cs-logo{height:34px;display:block}
.btn.o.cs-x{width:40px;height:40px;padding:0;border:0;border-radius:50%;background:transparent;box-shadow:none;justify-content:center;gap:0}
.btn.o.cs-x:hover{background:rgba(6,34,63,.08);color:var(--navy)}
.btn.o.cs-x svg{width:20px;height:20px}
.cs-body{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr}
.cs-stage{position:relative;overflow:hidden;container-type:size;background:radial-gradient(120% 90% at 30% 15%,#f0eee9,#dedbd4)}
.cs-scroll{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;outline:none}
.cs-scroll::-webkit-scrollbar{display:none}
.cs-in{padding:0 clamp(32px,5.5vw,104px)}
.cs-s{min-height:calc(var(--vh,1vh)*82);padding-top:calc(var(--vh,1vh)*14);opacity:.3;transition:opacity .6s}
.cs-s.on{opacity:1}
.cs-s:last-child{padding-bottom:calc(var(--vh,1vh)*36)}
.cs-s h1{font-size:clamp(34px,3.5vw,58px);line-height:1.06;margin:0 0 .5em}
.cs-s .lead{font-size:clamp(17px,1.35vw,21px);line-height:1.6;color:var(--navy);max-width:46ch;margin:0 0 2.2em}
.cs-s h2{font-size:clamp(26px,2.3vw,38px);line-height:1.15;margin:0 0 .6em}
.cs-s p{font-size:clamp(15px,1.1vw,17px);line-height:1.75;color:var(--mute);max-width:56ch;margin:0 0 1.2em}
.cs-dots{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);display:flex;gap:12px;align-items:center;z-index:2}
.cs-dots button{width:9px;height:9px;padding:0;border-radius:9px;border:1.5px solid var(--navy);background:transparent;cursor:pointer;transition:width .4s,background .4s}
.cs-dots button.on{width:30px;background:var(--navy)}
.cs-v{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transform:translate3d(0,6%,0) scale(.97);transition:opacity .7s ease,transform .9s cubic-bezier(.2,.7,.2,1);pointer-events:none}
.cs-v.on{opacity:1;transform:none}
.cs-v.past{transform:translate3d(0,-6%,0) scale(.97)}
/* visual: cover */
.v-cover{width:min(84cqw,calc(76cqh*1.7778));aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#cfccc6;box-shadow:0 40px 80px -30px rgba(6,34,63,.5);transform:translate3d(0,calc((.5 - var(--p,0))*28px),0)}
.v-cover img{width:100%;height:100%;object-fit:cover;display:block}
/* skeleton pieces that build in when a visual becomes active */
.sk{background:#e9e7e2;border-radius:10px;opacity:0;transform:translateY(14px);transition:transform .7s cubic-bezier(.2,.7,.2,1),opacity .7s;transition-delay:0s}
.cs-v.on .sk{opacity:1;transform:none;transition-delay:calc(var(--i,0)*70ms + 200ms)}
.sk.b{background:var(--acc)}
/* visual: UI */
.v-win{width:min(80cqw,calc(68cqh*1.45));aspect-ratio:1.45;background:#fff;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 40px 80px -30px rgba(6,34,63,.45);transform:translate3d(0,calc((.5 - var(--p,0))*22px),0)}
.v-bar{flex:none;height:9%;display:flex;gap:6px;align-items:center;padding:0 4%;background:#f6f5f2;border-bottom:1px solid #ebe9e4}
.v-bar i{width:9px;height:9px;border-radius:50%;background:#d6d3cc}
.v-ui{flex:1;min-height:0;display:grid;grid-template-columns:22% 1fr;gap:4%;padding:4%}
.v-side{display:grid;grid-auto-rows:9%;gap:7%;align-content:start}
.v-main{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:16% 1fr 12%;gap:4%}
.v-main .t{grid-column:1/-1}
.v-main .c{grid-row:2;border-radius:12px}
.v-main .b{grid-row:3;grid-column:1}
.v-main .l{grid-row:3;grid-column:2/4}
/* visual: flow */

  'I am being explicit about this scope on purpose. The strategy and the KV came from others; my contribution is how that direction became a usable, consistent, and good-looking product.']},
 {h:'Three audiences, three goals',v:'fn',d:[['General public','Understand HOMEDEC, then pick a path'],['Exhibition visitors','Register as a visitor'],['Exhibitors and brands','Register / book a booth']],b:[
  {ul:['<strong>General public</strong> (arriving from Instagram and other promotion) needs to know what HOMEDEC is, when and where it happens, and why it matters. Final conversion: move on to the visitor or exhibitor path.','<strong>Exhibition visitors</strong> need to know which booths will be there, what is on sale, and what activities and prizes to expect. Final conversion: register as a visitor.','<strong>Exhibitors and brands</strong> need to know who attends, what results past exhibitors got, and what kinds of brands join. Final conversion: register as an exhibitor / book a booth.']},
  {h3:'Site structure'},
  'The website has two layers, both built on the same design system:',
  {ul:['<strong>Main website:</strong> Home (general public), Visitor, Exhibitor, About, and Contact pages, connected by one navigation.','<strong>Promotion pages:</strong> separate Visitor Promotion and Exhibitor Promotion pages, designed as focused landing pages for promotion (for example from social media), each leading straight to registration.']},
  'The goal was to make sure a first-time visitor to the website could answer “is this for me?” within seconds, and always see the next step.']},
 {h:'Challenges',v:'icons',d:[['link','Third-party chain','Approvals through the agency'],['cal','Large-scale event','Credible within ~2 months'],['layers','Vibrant KV','Without overwhelming content'],['users','Three audiences','One structure, one system'],['phone','Every screen size','About half of traffic on mobile']],b:[
  {ol:['<strong>Communicating through a third-party chain.</strong> I worked with the agency, not directly with the client, so design decisions needed to be easy to explain and easy to approve. I prepared clear rationale for each key decision so the visual director could present it confidently, which kept revision rounds minor.','<strong>Meeting the expectations of a large-scale event.</strong> HOMEDEC is a major exhibition with many partners, sponsors, and a high visitor target. The website had to look credible and polished to both brands deciding whether to invest in a booth and the public deciding whether to attend, within roughly two months.','<strong>Applying a vibrant KV without overwhelming the content.</strong> The KV is colorful, with gradients, circles, and layered shapes. Used everywhere, it would compete with the information people came for.','<strong>One structure for three audiences.</strong> Each audience needed different content and a different call to action, without making the website feel like three disconnected sites.','<strong>Responsive design at every size.</strong> Based on third-party data, about half of the traffic came from mobile (see Results), so mobile could not be an afterthought.']}]},
 {h:'Let the KV frame the content',v:'kv',d:{items:[['assets/homedec/kv-1.webp','Key visual in the sections page'],['assets/homedec/kv-2.webp','Key visual in the gallery section'],['assets/homedec/kv-3.webp','Key visual in the join banner']]},b:[
  'The KV’s gradients and modular shapes are used where they have the most impact: the hero, section edges, and corners. In between, the content sits on calm, light backgrounds with strong text contrast. Color blocks (purple, orange, green) mark the boundaries between sections, so the page has rhythm without every area being busy.',
  {quote:'The result is a page that clearly feels like HOMEDEC, but where the information stays the main focus.'}]},
 {h:'One path, one color per audience',v:'pic',d:{items:[['assets/homedec/cta.webp','Hero buttons: Informasi Peserta (green) and Pesan Booth (orange)']]},b:[
  'Calls to action are consistent and repeated at natural decision points (hero, mid-page, and footer):',
  {ul:['<strong>Visitors:</strong> a green “Registrasi Pengunjung” button','<strong>Exhibitors:</strong> an orange “Pesan Booth” button']},
  'Using the same two colors for the same two actions across all pages teaches users the system quickly, and makes it obvious which action is for whom.']},
 {h:'Home Page: Select Direction, then Route',v:'web',d:{items:[['assets/homedec/home.webp','HOMEDEC homepage on desktop'],['assets/homedec/home-m.webp','HOMEDEC homepage on mobile']]},b:[
  'The home page introduces the event (what, when, where), then splits attention between the two audiences with the “Kunjungi HOMEDEC 2026!” section for visitors and the “Bergabunglah di HOMEDEC 2026” section for brands. Brand highlights and partner logos build credibility. Its job is to route people, not to overload them.']},
 {h:'Visitor promotion page',v:'web',d:{items:[['assets/homedec/visitor-promo.webp','Visitor promotion page, desktop'],['assets/homedec/visitor-promo-m.webp','Mobile']]},b:[
  'The visitor promotion page leads with what visitors care about most: what they can win and what they can see. It includes:',

 {h:'Exhibitor promotion page',v:'web',d:{items:[['assets/homedec/exhibitor-promo.webp','Exhibitor promotion page, desktop'],['assets/homedec/exhibitor-promo-m.webp','Mobile']]},b:[

 {h:'A system that scales to every screen',v:'phones',d:{items:[['assets/homedec/m-nav.webp','Menu collapses'],['assets/homedec/m-cards.webp','Cards stack'],['assets/homedec/m-logos.webp','Logo grids stay readable']]},b:[
  'I designed reusable components (cards, carousels, logo grids, section headers, CTA blocks) that reflow cleanly: navigation collapses into a menu on mobile, card grids stack into single columns, and dense partner logo sections stay readable. The same visual language holds from large desktop screens to phones.']},
 {h:'Collaboration',v:'icons',d:[['eye','Visual director','Aligned on how far to push the KV'],['code','Developers','Specs, handoff, build checks'],['redo','Revisions','Only minor changes after review']],b:[

 {h:'Reflection',v:'icons',d:[['eye','Clarity','beats decoration'],['target','Decisions','not just pages'],['msg','Clear communication','makes agency approval faster'],['zap','Improve mobile load','lighter images next']],b:[
  {ul:['<strong>Clarity beats decoration.</strong> The KV gave the project energy, but the website works because each page has one job and one call to action.','<strong>Design for the decision, not just the page.</strong> Visitors need a reason to come; exhibitors need proof it is worth it. Different intent, different content.','<strong>Working through an agency takes clear communication.</strong> Designs that explain themselves make approval faster, especially when you are not in the room with the client.','<strong>Improve mobile load.</strong> Strong accessibility, SEO, and desktop speed were achieved, but mobile performance has room to improve, mainly through lighter image formats on the development side.','<strong>Next steps:</strong> work with developers to reduce image weight on mobile.']},
