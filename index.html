 const wl=cv(256,512,(g)=>{g.setTransform(1,0,-.4,1,110,0);const a=g.createLinearGradient(0,0,200,0);a.addColorStop(0,'rgba(255,255,255,0)');a.addColorStop(.3,'rgba(255,248,225,.9)');a.addColorStop(.7,'rgba(255,248,225,.9)');a.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=a;g.fillRect(0,0,200,512);g.setTransform(1,0,0,1,0,0);g.globalCompositeOperation='destination-in';const b=g.createLinearGradient(0,0,0,512);b.addColorStop(0,'rgba(0,0,0,0)');b.addColorStop(.25,'#000');b.addColorStop(.75,'#000');b.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=b;g.fillRect(0,0,256,512)});
 [[-4.2,0],[4*BAY-4.2,0],[6*BAY-4,0]].forEach(p=>add(new THREE.Mesh(new THREE.PlaneGeometry(2.6,5.2),new THREE.MeshBasicMaterial({map:tx(wl),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,opacity:.3})),p[0],2.6,.02,false))}

function plant(x,z){const g=new THREE.Group(),m1=M(0x2e6a3c,.55,{side:THREE.DoubleSide}),m2=M(0x3f8450,.5,{side:THREE.DoubleSide}),lg=new THREE.SphereGeometry(1,14,8);lg.scale(.11,.5,.022);lg.translate(0,.5,0);
 add(new THREE.Mesh(new THREE.CylinderGeometry(.32,.23,.58,32),M(0xf1eee8,.35)),0,.29,0,true,g);
 for(let i=0;i<24;i++){const pv=new THREE.Group(),l=new THREE.Mesh(lg,i%2?m1:m2);pv.position.y=.55;pv.rotation.y=i*2.4;l.rotation.z=.18+(i%6)*.12;l.scale.setScalar(.85+(i%4)*.14);l.castShadow=true;pv.add(l);g.add(pv)}g.position.set(x,0,z);scene.add(g)}
function bench(x,z){const g=new THREE.Group();add(new THREE.Mesh(new THREE.BoxGeometry(2.4,.16,.72),M(0x1b1c1e,.4)),0,.52,0,true,g);
 [[-1.05,-.26],[1.05,-.26],[-1.05,.26],[1.05,.26]].forEach(p=>add(new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,.46,12),M(0xe6e6e6,.12,{metalness:1})),p[0],.23,p[1],true,g));g.position.set(x,0,z);scene.add(g)}
function sculpt(x,z){const g=new THREE.Group();add(new THREE.Mesh(new THREE.BoxGeometry(.72,1.05,.72),M(0xf5f3ef,.5)),0,.525,0,true,g);add(new THREE.Mesh(new THREE.SphereGeometry(.3,48,32),M(0xffffff,.05,{metalness:1})),0,1.37,0,true,g);g.position.set(x,0,z);scene.add(g)}
plant(6.4,2.4);bench(2.4,3.4);plant(BAY+6.2,1.6);bench(2*BAY-5.6,2.6);plant(3*BAY+6.4,1.8);sculpt(4*BAY-5.6,2.4);plant(5*BAY-6.2,1.8);sculpt(6*BAY+5.4,2.2);plant(6*BAY+6.6,1.6);
/* post: HDR render target (MSAA) -> bloom -> tone map. Cover pixels (alpha 0) skip ACES so toneMapped:false really holds. */
const comp=new EffectComposer(R,new THREE.WebGLRenderTarget(8,8,{type:THREE.HalfFloatType,samples:Q.ms}));comp.addPass(new RenderPass(scene,cam));
const bloom=new UnrealBloomPass(new THREE.Vector2(256,256),.75,.6,1.0);comp.addPass(bloom);
comp.addPass(new ShaderPass(new THREE.RawShaderMaterial({toneMapped:false,uniforms:{tDiffuse:{value:null},toneMappingExposure:{value:R.toneMappingExposure}},
 vertexShader:'precision highp float;attribute vec3 position;attribute vec2 uv;uniform mat4 modelViewMatrix;uniform mat4 projectionMatrix;varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'precision highp float;uniform sampler2D tDiffuse;varying vec2 vUv;\n#include <tonemapping_pars_fragment>\n#include <colorspace_pars_fragment>\nvoid main(){vec4 c=texture2D(tDiffuse,vUv);vec3 col=c.rgb;if(c.a>.5)col=ACESFilmicToneMapping(col);gl_FragColor=sRGBTransferOETF(vec4(clamp(col,0.,1.),1.));}'})));
/* overlays */
const sections=[
`<div class="home"><div class="eb">Portfolio 2026</div><h1>Hi, I’m <em>${ME.name}.</em></h1><p><b style="color:var(--navy);font-weight:500">${ME.role}.</b><br>${ME.tag}</p><div class="hint">Scroll to enter →</div></div>`,
`<div class="glass l"><div class="eb">About</div><h2>Designer, builder, problem solver.</h2><p>${ME.bio}</p><div class="row"><a class="btn" href="${ME.cv}">Download CV ↓</a><a class="t" href="mailto:${ME.email}">Say hello</a></div></div><div class="glass r"><h3>Experience</h3>${HISTORY.map(h=>`<div class="h"><span>${h[0]}</span><div><b>${h[1]}</b><br><span>${h[2]}</span></div></div>`).join('')}</div>`,
...WORKS.map((w,k)=>`<div class="wk"><div class="n">0${k+1} / Selected work</div><h2>${w.t}</h2><p>${w.d}</p><a class="btn" href="#" onclick="return false">View case study →</a></div>`),
`<div class="contact"><div class="eb">Contact</div><h2>Let’s build something good.</h2><a class="mail" href="mailto:${ME.email}">${ME.email}</a><div class="row"><a class="btn" href="${ME.upwork}">Hire me on Upwork →</a><a class="btn o" href="${ME.dribbble}">Explorations on Dribbble ↗</a></div></div>`];
$('ovs').innerHTML=sections.map(s=>`<div class="ov">${s}</div>`).join('');
const OV=[...document.querySelectorAll('.ov')],dots=OV.map((_,k)=>{const b=document.createElement('button');b.setAttribute('aria-label','Go to '+(k+1));b.onclick=()=>go(k);$('dots').appendChild(b);return b});
const links=[...document.querySelectorAll('#nav a')];links.forEach(a=>a.onclick=()=>go(+a.dataset.g));
let i=0,lock=false,cx=0,smx=0,smy=0,mx=0,my=0,Z0=11;
function render(){OV.forEach((o,k)=>o.classList.toggle('on',k===i));dots.forEach((d,k)=>d.classList.toggle('on',k===i));$('prev').disabled=!i;$('next').disabled=i===N-1;const g=i<2?i:i<6?2:6;links.forEach(a=>a.classList.toggle('on',+a.dataset.g===g))}
const go=n=>{n=Math.max(0,Math.min(N-1,n));if(n!==i){i=n;render()}};
const step=d=>{if(lock)return;const b=i;go(i+d);if(i!==b){lock=true;setTimeout(()=>lock=false,1100)}};
addEventListener('wheel',e=>{e.preventDefault();const d=Math.abs(e.deltaY)>Math.abs(e.deltaX)?e.deltaY:e.deltaX;if(Math.abs(d)>8)step(Math.sign(d))},{passive:false});
addEventListener('keydown',e=>{if(/Arrow(Right|Down)|PageDown| /.test(e.key))step(1);if(/Arrow(Left|Up)|PageUp/.test(e.key))step(-1)});
let sx=null,sy=0;addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
addEventListener('pointerup',e=>{if(sx!==null&&Math.abs(e.clientX-sx)>50&&Math.abs(e.clientX-sx)>Math.abs(e.clientY-sy))step(e.clientX<sx?1:-1);sx=null});
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth*2-1;my=e.clientY/innerHeight*2-1;const s=document.documentElement.style;s.setProperty('--mx',mx.toFixed(3));s.setProperty('--my',my.toFixed(3))});
$('prev').onclick=()=>go(i-1);$('next').onclick=()=>go(i+1);
function size(){const w=innerWidth,h=innerHeight,a=w/h,m=a<1||w<800,fr=m?.7:.45,pr=Math.min(devicePixelRatio,Q.pr);Z0=m?9:10.5;
 /* FOV solved so a 4.8 m display fills ~45% (desktop) / ~70% (mobile) of the viewport width at the resting camera distance */
 cam.fov=THREE.MathUtils.clamp(2*Math.atan(4.8/fr/a/2/Z0)*180/Math.PI,24,75);cam.aspect=a;R.setPixelRatio(pr);R.setSize(w,h);comp.setPixelRatio(pr);comp.setSize(w,h);cam.updateProjectionMatrix()}
addEventListener('resize',size);size();render();
const clock=new THREE.Clock();
(function loop(){const t=clock.getElapsedTime(),target=i*BAY,d=target-cx;cx+=d*.05;smx+=(mx-smx)*.05;smy+=(my-smy)*.05;
 cam.position.set(cx+smx*.4,1.65-smy*.1+Math.sin(t*.8)*.012,Z0-Math.min(Math.abs(d)*.1,1.5));cam.lookAt(cx+smx*.6,1.65-smy*.12,0);
 sun.position.set(cx-8,9.5,10);sun.target.position.set(cx,0,0);comp.render();requestAnimationFrame(loop)})();
